restockr:
  api_base: "https://emerald-alerts-development.onrender.com/api"
  socket_url: "https://emerald-alerts-development.onrender.com"

autobuy:
  enabled: true
  # Only act on SKUs on your RestockR watchlist (recommended)
  watchlist_only: true
  max_price: null
  max_quantity: null
  # Minimum Target stock quantity before buying / opening
  target_min_quantity: 1
  cooldown_seconds: 300
  dedup_window_seconds: 60
  retailers:
    - target
