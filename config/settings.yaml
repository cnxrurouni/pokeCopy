restockr:
  api_base: "https://emerald-alerts-development.onrender.com/api"
  socket_url: "https://emerald-alerts-development.onrender.com"

autobuy:
  enabled: true
  # Only act on SKUs on your RestockR watchlist (recommended)
  watchlist_only: true
  max_price: null
  max_quantity: null
  # Minimum Target stock quantity before buying / opening
  target_min_quantity: 1
  cooldown_seconds: 300
  dedup_window_seconds: 60
  retailers:
    - target

# Discord → HTTP checkout (reseller run --source discord|both).
# Requires DISCORD_BOT_TOKEN + bot invited to the server with Message Content Intent.
discord:
  guild_id: "1457553935848964251"
  channel_id: "1457563918720569394"
  token_env: DISCORD_BOT_TOKEN
  watchlist_only: false
  open_in_chrome: true
