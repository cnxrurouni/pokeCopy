reseller:
  # Always live — RestockR → HTTP checkout places real orders.
  global_concurrency: 10
  per_account_concurrency: 1

  # Sidecar _px3 TTL guidance for the in-memory token bank.
  px_token_ttl_seconds: 300

  max_attempts: 3
  max_quantity: null

  # Mash ATC until success / stock-limit / timeout (hot drops need minutes).
  atc_spam_timeout_seconds: 300
  # Mash checkout/pre_checkout/place_order until order or cart loses the TCIN.
  # Cart GET flakes (429/timeout) do NOT count as empty — only HTTP 200 + missing.
  checkout_spam_timeout_seconds: 1200
  # ATC retries — 500ms–1s jitter; no long 429 cooldown on ATC.
  atc_retry_delay_ms_min: 500
  atc_retry_delay_ms_max: 1000
  # Checkout / pre_checkout / place_order retries.
  spam_delay_ms_min: 1500
  spam_delay_ms_max: 3000
  # Optional: open Chrome /cart→/checkout before ATC to refresh PX.
  # Default off — login target already exports auth+_px3; warming with CDP
  # right before HTTP often triggers transient Go-Proxy 401 (MI6 issuer).
  warm_cart_checkout: false
  warm_dwell_seconds: 3.0
  # Prefer everyday-Chrome ATC (AppleScript click) — skip HTTP ATC which
  # AUTH_DENIEDs hot SKUs. Checkout / pre_checkout / place_order stay HTTP.
  browser_assist_atc: true
  browser_assist_timeout_seconds: 120
  # HTTP ATC: 0 = never abort on AUTH_DENIED streak (keep until timeout/stock).
  # Browser-assist path ignores this (it skips HTTP ATC).
  auth_denied_abort_after: 0
  # After this many consecutive 429s on non-ATC steps, cool down still applies
  # but we do not hard-stop the checkout window (cart-gone / timeout stop instead).
  # ATC never hard-stops on 429 — cooldown + continue until atc_spam_timeout.
  rate_limit_abort_after: 0
  rate_limit_cooldown_seconds: 60

  accounts_path: null
  capture_path: null

  # Checkout infra: "web" (desktop Chrome capture + optional browser-assist)
  # or "mobile" (iOS app capture from Proxyman — separate client, no browser ATC).
  checkout_channel: web

  # Optional pin; omit to auto-pick newest Chrome target this curl_cffi supports.
  # curl_impersonate: "chrome146"
  curl_impersonate: null
